[project]
name = "finance-toolkit"
version = "1.0.0"
description = "Dependency-free corporate finance calculations: TVM, bond pricing/YTM, DuPont ROE, CFFA, and sustainable growth rate."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Het Patel" }
]
license = { text = "MIT" }

[project.scripts]
finance-toolkit = "finance_toolkit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finance_toolkit*"]
